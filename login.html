<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back2U - Login</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="forms.css">

    <script src="forms.js" defer></script>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
    <a href="index.html#items">View Items</a>
</nav>

<h1>Welcome Back to Back2U</h1>

<img src="images/back2u-banner.jpg"
     alt="Back2U Lost and Found"
     class="banner-image"
     usemap="#login-map">

<map name="login-map">
    <area shape="default"
          href="about.html"
          alt="About Us">
</map>

<main class="form-container">

    <h2>Login</h2>

    <p class="form-description">
        Login to your Back2U account to find your lost belongings.
    </p>

    <form id="loginForm">

        <label for="loginEmail">Email Address</label>
        <input type="email"
               id="loginEmail"
               name="email"
               placeholder="Enter your email"
               required>

        <label for="loginPassword">Password</label>
        <input type="password"
               id="loginPassword"
               name="password"
               placeholder="Enter your password"
               required
               minlength="8">

        <button type="submit">Login</button>

        <p id="loginMessage" class="form-message" aria-live="polite"></p>

    </form>

    <p class="form-link">
        Don't have an account?
        <a href="signup.html">Sign Up</a>
    </p>

</main>

<footer class="form-footer">
    Back2U - Lost & Found for University Students
</footer>

</body>
</html>
