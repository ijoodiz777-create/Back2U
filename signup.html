<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back2U - Sign Up</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="forms.css">

    <script src="forms.js" defer></script>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
    <a href="index.html#items">View Items</a>
</nav>

<h1>Join Back2U</h1>

<img src="images/back2u-banner.jpg"
     alt="Back2U Lost and Found"
     class="banner-image"
     usemap="#signup-map">

<map name="signup-map">
    <area shape="default"
          href="about.html"
          alt="About Us">
</map>

<main class="form-container">

    <h2>Create Account</h2>

    <p class="form-description">
        Create your account and join our university lost and found community.
    </p>

    <form id="signupForm">

        <label for="fullName">Full Name</label>
        <input type="text"
               id="fullName"
               name="fullName"
               placeholder="Enter your full name"
               required>

        <label for="signupEmail">Email Address</label>
        <input type="email"
               id="signupEmail"
               name="email"
               placeholder="Enter your email"
               required>

        <label for="signupPassword">Password</label>
        <input type="password"
               id="signupPassword"
               name="password"
               placeholder="Create a password"
               minlength="8"
               required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password"
               id="confirmPassword"
               name="confirmPassword"
               placeholder="Confirm your password"
               minlength="8"
               required>

        <button type="submit">Create Account</button>

        <p id="signupMessage" class="form-message" aria-live="polite"></p>

    </form>

    <p class="form-link">
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</main>

<footer class="form-footer">
    Back2U - Lost & Found for University Students
</footer>

</body>
</html>
